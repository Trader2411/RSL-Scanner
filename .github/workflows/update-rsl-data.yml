name: Update RSL data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_rsl_data.py
      - scripts/crypto_history.py
      - requirements-web.txt
      - .github/workflows/update-rsl-data.yml
  schedule:
    # Hourly every day: the exported crypto universe trades 24/7.
    - cron: '23 * * * *'
    # Recovery attempt 30 minutes later; it only rebuilds when data is stale.
    - cron: '53 * * * *'

permissions:
  contents: write

concurrency:
  group: rsl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements-web.txt

      - name: Decide whether fresh RSL data is needed
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ github.event.schedule }}" in
            "23 * * * *")
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          NEEDS_BUILD=$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("docs/data.json")
          if not p.exists():
              print("true")
              raise SystemExit

          try:
              payload = json.loads(p.read_text(encoding="utf-8"))
              ts = payload.get("generated_at")
              dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
              age_minutes = (datetime.now(timezone.utc) - dt).total_seconds() / 60
              print("true" if age_minutes >= 45 else "false")
          except Exception:
              print("true")
          PY
          )
          echo "run=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"

      - name: Verify complete-day recovery
        run: python tests/test_crypto_history.py

      - name: Build fresh RSL data
        if: steps.freshness.outputs.run == 'true'
        run: python scripts/build_rsl_data.py

      - name: Save RSL independently of MomentumRadar
        if: steps.freshness.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          git diff --cached --quiet || git commit -m 'Refresh RSL market data'
          # MomentumRadar may advance main while RSL is being calculated.
          # Retry without force-pushing or masking a real merge conflict.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Conflicting remote edit: RSL data not pushed.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "Push failed; refresh remote state and retry ${attempt}/3." >&2
          done
          echo 'RSL data could not be saved after three attempts.' >&2
          exit 1
