name: Update RSL data
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_rsl_data.py"
      - "requirements-web.txt"
      - ".github/workflows/update-rsl-data.yml"
  schedule:
    - cron: "17 */2 * * 1-5"
    - cron: "17 */6 * * 0,6"

permissions:
  contents: write

concurrency:
  group: rsl-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-web.txt

      - run: python scripts/build_rsl_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Refresh RSL market data"
          git pull --rebase origin main
          git push origin main
