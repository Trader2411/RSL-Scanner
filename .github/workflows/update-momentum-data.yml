name: Update MomentumRadar data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: momentum-data-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-web.txt
      - run: python scripts/momentum_delivery.py --force-full
      - name: Save complete snapshot
        run: bash scripts/save_momentum_snapshot.sh
