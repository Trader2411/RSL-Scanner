name: Update MomentumRadar data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_momentum_data.py"
      - "requirements-web.txt"
      - ".github/workflows/update-momentum-data.yml"
  schedule:
    - cron: "5 8-21 * * 1-5"
    - cron: "35 13,14 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: momentum-radar-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-web.txt

      - name: Build MomentumRadar JSON
        run: python scripts/build_momentum_data.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/momentum-radar/data.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data.get('version') == 'momentum-radar-mvp-2'
          assert 'candidates' in data and 'coverage' in data and 'universes' in data
          assert 'Emerging Markets' in data['universes']
          print('JSON OK:', data['coverage'])
          PY

      - name: Upload current site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit refreshed MomentumRadar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/momentum-radar/data.json
          git diff --cached --quiet || git commit -m "Refresh MomentumRadar market data"
          git pull --rebase origin main
          git push origin main

  deploy:
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest site
        id: deployment
        uses: actions/deploy-pages@v4