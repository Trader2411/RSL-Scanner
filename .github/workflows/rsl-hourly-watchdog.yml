name: RSL hourly watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rsl-hourly-watchdog.yml"
  schedule:
    - cron: "22 * * * 1-5"
    - cron: "52 * * * 1-5"
    - cron: "22 1,7,13,19 * * 0,6"

permissions:
  contents: write

concurrency:
  group: rsl-hourly-watchdog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-web.txt

      - name: Build fresh RSL data
        run: python scripts/build_rsl_data.py

      - name: Save fresh RSL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Refresh RSL market data"
          git pull --rebase origin main
          git push origin main
