name: Update MomentumRadar candidate watch
on:
  workflow_dispatch:
    inputs:
      force_full:
        description: Vollscan jetzt erneuern
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/build_momentum_watch.py
      - scripts/build_momentum_data.py
      - scripts/momentum_delivery.py
      - scripts/save_momentum_snapshot.sh
      - .github/workflows/update-momentum-watch.yml
      - requirements-web.txt
  schedule:
    - cron: '7,22,37,52 8-21 * * 1-5'
  workflow_run:
    workflows: [Update RSL data]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: momentum-data-write
  cancel-in-progress: false
jobs:
  watch:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-web.txt
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -p 'test_momentum*.py' -v
          node --test tests/state.test.cjs
      - name: Refresh full scan when due, then check candidates
        env:
          FORCE_FULL: ${{ github.event_name == 'push' || inputs.force_full == true }}
        run: |
          if [ "$FORCE_FULL" = 'true' ]; then
            python scripts/momentum_delivery.py --force-full
          else
            python scripts/momentum_delivery.py
          fi
      - name: Save coherent snapshot and histories
        run: bash scripts/save_momentum_snapshot.sh
